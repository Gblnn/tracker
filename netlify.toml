[build]
  command = "npm run build"
  publish = "dist"

# Non-sensitive defaults — set TIMETAAG_AUTH_KEY and TIMETAAG_API_KEY in the Netlify dashboard.
[context.production.environment]
  TIMETAAG_CLIENT_DB_NAME = "tt_10000"

[context.deploy-preview.environment]
  TIMETAAG_CLIENT_DB_NAME = "tt_10000"

[[redirects]]
  from = "/*"
  to = "/"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"